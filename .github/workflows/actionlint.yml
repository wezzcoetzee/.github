name: Lint workflows

# Every macOS app tracks the reusable workflows at @main, so a broken
# workflow here breaks CI or releases everywhere at once.

on:
  pull_request:
    paths: [.github/workflows/**]
  push:
    branches: [main]
    paths: [.github/workflows/**]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Also runs shellcheck over every `run:` block.
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
